name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Puppeteer is only used for local prerendering; skip its ~150MB Chrome download.
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - run: npm run build

      # The app uses BrowserRouter, so routes like /productos/impresoras have no file on disk.
      # GitHub Pages serves 404.html for unknown paths; a copy of index.html lets React Router
      # render the right page on direct visits and refreshes.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
