name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Puppeteer is only used for local prerendering; skip its ~150MB Chrome download.
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - run: npm run build

      # The app uses BrowserRouter, so routes like /productos/impresoras have no file on disk.
      # Each sitemap route gets a copy of index.html (GitHub Pages serves /a/b from a/b.html
      # with status 200, which search engines need). 404.html covers every other path,
      # such as /eventos/:slug, so React Router still renders it on direct visits.
      - name: Add a page file for every sitemap route
        run: |
          for route in $(grep -o '<loc>[^<]*</loc>' dist/sitemap.xml | sed -E 's#<loc>https?://[^/]+/?##; s#/?</loc>##'); do
            mkdir -p "dist/$(dirname "$route")"
            cp dist/index.html "dist/$route.html"
          done
          cp dist/index.html dist/404.html
          ls dist/*.html dist/*/*.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages publishing occasionally stalls; the default 10-minute wait cancels the deployment,
      # and GitHub then refuses to redeploy that commit. 20 minutes leaves headroom.
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
